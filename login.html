<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login / Signup</title>
<style>
:root{--accent:#34d399;--muted:#9ca3af}
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#021025);font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff}
.card{width:360px;background:rgba(255,255,255,0.04);padding:20px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.7)}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.tab{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,0.06);cursor:pointer;color:#fff}
.tab.active{background:#fff;color:#0b1220;box-shadow:0 6px 14px rgba(0,0,0,0.4)}
h2{text-align:center;margin:4px 0 12px;font-weight:600}
.form-row{margin:8px 0}
input{width:100%;padding:10px;border-radius:8px;border:none;background:rgba(255,255,255,0.03);color:#fff;outline:none}
button.primary{width:100%;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#04211a;font-weight:700;cursor:pointer;margin-top:10px}
.msg{height:20px;margin-top:8px;text-align:center;font-weight:600;color:#ffdede}
.hidden{display:none}
small.note{display:block;margin-top:6px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="card" role="main">
  <div class="tabs">
    <div id="tabLogin" class="tab active" onclick="showForm('login')">Login</div>
    <div id="tabSignup" class="tab" onclick="showForm('signup')">Signup</div>
  </div>

  <!-- LOGIN FORM -->
  <div id="loginForm">
    <h2>Login</h2>
    <div class="form-row"><input id="loginUsername" placeholder="Username / Email" autocomplete="username"></div>
    <div class="form-row"><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password"></div>
    <button id="loginSubmit" class="primary" type="button">Login</button>
    <div id="loginMsg" class="msg"></div>
    <small class="note">Demo: enter any non-empty credentials</small>
  </div>

  <!-- SIGNUP FORM -->
  <div id="signupForm" class="hidden">
    <h2>Create account</h2>
    <div class="form-row"><input id="signupName" placeholder="Full name" autocomplete="name"></div>
    <div class="form-row"><input id="signupEmail" placeholder="Email" autocomplete="email"></div>
    <div class="form-row"><input id="signupUsername" placeholder="Username" autocomplete="username"></div>
    <div class="form-row"><input id="signupPassword" type="password" placeholder="Password" autocomplete="new-password"></div>
    <div class="form-row"><input id="signupConfirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password"></div>
    <button id="signupSubmit" class="primary" type="button">Create Account</button>
    <div id="signupMsg" class="msg"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const S = sessionStorage;
  const L = localStorage;
  const $ = id => document.getElementById(id);

  // --- Tab switch ---
  window.showForm = (mode) => {
    if(mode==='signup'){
      $('loginForm').classList.add('hidden');
      $('signupForm').classList.remove('hidden');
      $('tabLogin').classList.remove('active');
      $('tabSignup').classList.add('active');
      $('signupName')?.focus();
    } else {
      $('signupForm').classList.add('hidden');
      $('loginForm').classList.remove('hidden');
      $('tabSignup').classList.remove('active');
      $('tabLogin').classList.add('active');
      $('loginUsername')?.focus();
    }
  }
  showForm('login');

  function readJSON(store,key,fallback=null){ try{ const v=store.getItem(key); return v?JSON.parse(v):fallback }catch{ return fallback } }
  function writeJSON(store,key,obj){ store.setItem(key,JSON.stringify(obj)) }
  function removeKey(store,key){ try{ store.removeItem(key) }catch{} }

  function getSavedCart(){ return S.getItem('cartBeforeLogin') ?? L.getItem('cartBeforeLogin') ?? null }

  // --- LOGIN ---
  $('loginSubmit')?.addEventListener('click', ()=>{
    const msg = $('loginMsg');
    msg.textContent=''; msg.style.color='red';
    const username = $('loginUsername')?.value.trim()||'';
    const password = $('loginPassword')?.value.trim()||'';

    if(!username||!password){ msg.textContent='⚠️ Enter username and password'; return; }

    // Local users check
    let users = readJSON(L,'users',[]);
    let matched = users.find(u=> (u.username===username||u.email===username) && u.password===password);
    let user;
    if(matched){
      user = {userId:matched.userId, username:matched.username, email:matched.email};
    } else { 
      // Demo login: allow any credentials
      user = {userId:Date.now(), username, email:username.includes('@')?username:username+'@example.com'};
    }

    writeJSON(S,'auth',user);

    // restore cart
    const savedCart = getSavedCart();
    if(savedCart && (!S.getItem('cartItems')||S.getItem('cartItems')==='[]')){
      S.setItem('cartItems',savedCart);
      removeKey(S,'cartBeforeLogin'); removeKey(L,'cartBeforeLogin');
    }

    msg.style.color='lightgreen';
    msg.textContent='✅ Login successful — redirecting to shipping...';
    setTimeout(()=> window.location.href='shipping.html',600);
  });

  // --- SIGNUP ---
  $('signupSubmit')?.addEventListener('click', ()=>{
    const msg = $('signupMsg');
    msg.textContent=''; msg.style.color='red';
    const name = $('signupName')?.value.trim()||'';
    const email = $('signupEmail')?.value.trim()||'';
    const username = $('signupUsername')?.value.trim()||'';
    const password = $('signupPassword')?.value||'';
    const confirm = $('signupConfirmPassword')?.value||'';

    if(!name||!email||!username||!password||!confirm){ msg.textContent='⚠️ All fields required'; return; }
    if(password!==confirm){ msg.textContent='⚠️ Passwords do not match'; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.textContent='⚠️ Enter a valid email'; return; }

    let users = readJSON(L,'users',[]);
    if(users.find(u=> u.username===username||u.email===email)){ msg.textContent='⚠️ Username or email already exists'; return; }

    const newUser = { userId:Date.now(), username, email, password };
    users.push(newUser); writeJSON(L,'users',users);
    const authUser = { userId:newUser.userId, username:newUser.username, email:newUser.email };
    writeJSON(S,'auth',authUser);

    // restore cart
    const savedCart = getSavedCart();
    if(savedCart && (!S.getItem('cartItems')||S.getItem('cartItems')==='[]')){
      S.setItem('cartItems',savedCart);
      removeKey(S,'cartBeforeLogin'); removeKey(L,'cartBeforeLogin');
    }

    msg.style.color='lightgreen';
    msg.textContent='✅ Signup successful — redirecting to shipping...';
    setTimeout(()=> window.location.href='shipping.html',600);
  });

  // Enter key submit
  document.addEventListener('keydown',(e)=>{
    if(e.key!=='Enter') return;
    if(!$('loginForm')?.classList.contains('hidden')) $('loginSubmit')?.click();
    else if(!$('signupForm')?.classList.contains('hidden')) $('signupSubmit')?.click();
  });
  $('loginUsername')?.focus();
});
</script>
</body>
</html>
