<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f8f9fa;
    }
    .payment-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 340px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-align: center;
    }
    h2 { margin-bottom: 20px; }
    .method {
      margin: 20px 0;
      text-align: left;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="payment-box">
    <h2>Payment Method</h2>

    <div class="method">
      <label>
        <input type="radio" name="payment" value="Cash on Delivery" checked>
        Cash on Delivery (COD)
      </label>
    </div>

    <button id="payBtn">Confirm & Pay</button>
  </div>

  <script>
    document.getElementById("payBtn").addEventListener("click", () => {
      const selectedMethod = "Cash on Delivery"; // only COD
      
      // ✅ store payment type in session
      sessionStorage.setItem("paymentType", selectedMethod);

      // redirect to summary
      window.location.href = "summary.html";
    });
  </script>
</body>
</html>
