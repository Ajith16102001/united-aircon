<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Shipping Details</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f7fbff;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.wrap{max-width:620px;width:100%;background:#fff;padding:20px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
h2{margin:0 0 12px;color:#0077b6}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1 / -1}
input,textarea,select{padding:10px;border:1px solid #cfd6df;border-radius:8px;width:100%}
.btn{grid-column:1 / -1;padding:12px;border:none;border-radius:10px;background:#0077b6;color:#fff;font-weight:800;cursor:pointer}
.note{margin-top:8px;color:#555}
@media (max-width:600px){ form{grid-template-columns:1fr} .full{grid-column:1 / -1} }
</style>
</head>
<body>
<div class="wrap">
  <h2>Shipping Details</h2>
  <form id="shipForm">
    <input class="full" id="name" placeholder="Recipient Name" required />
    <input id="phone" placeholder="Phone" required />
    <input id="city" placeholder="City" required />
    <input id="state" placeholder="State" required />
    <input id="pincode" placeholder="Pincode" required />
    <textarea class="full" id="address" placeholder="Address" rows="3" required></textarea>
    <button class="btn" type="submit">Continue to Payment</button>
  </form>
  <div class="note" id="msg"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const msg = document.getElementById('msg');

  // ✅ Retrieve auth and cart from sessionStorage (or localStorage if needed)
  const auth = JSON.parse(sessionStorage.getItem('auth') || '{}');
  const cart = JSON.parse(sessionStorage.getItem('cartItems') || '[]');

  // ===== LOGIN REQUIRED EVERY PURCHASE =====
  if (!auth.userId) {
    alert("⚠️ Login required to continue.");
    if (cart.length) sessionStorage.setItem('cartBeforeLogin', JSON.stringify(cart));
    sessionStorage.setItem('redirectAfterLogin', 'shipping.html');
    window.location.href = 'login.html';
    return;
  }

  // ===== CART MUST NOT BE EMPTY =====
  if (!cart.length) {
    alert("⚠️ Your cart is empty.");
    window.location.href = 'products.html';
    return;
  }

  // ===== RENDER CART ITEMS IN SHIPPING PAGE =====
  const cartContainer = document.getElementById('cartItems');
  const totalBox = document.getElementById('totalPrice');
  let total = 0;

  if (cartContainer) {
    cartContainer.innerHTML = cart.map(item => {
      const line = item.price * item.qty;
      total += line;
      return `
        <div class="cart-item">
          <img src="${item.img}" alt="${item.name}" width="60">
          <div class="item-info">
            <div>${item.name} × ${item.qty}</div>
            <div>₹${item.price} × ${item.qty} = ₹${line}</div>
          </div>
        </div>
      `;
    }).join("");
  }
  if (totalBox) totalBox.textContent = total;

  // ===== SHIPPING FORM SUBMIT =====
  const shipForm = document.getElementById('shipForm');
  if (!shipForm) return;

  shipForm.addEventListener('submit', (e) => {
    e.preventDefault();
    msg.textContent = "";

    const shipping = {
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      city: document.getElementById('city').value.trim(),
      state: document.getElementById('state').value.trim(),
      pincode: document.getElementById('pincode').value.trim(),
      address: document.getElementById('address').value.trim()
    };

    // ===== VALIDATION =====
    if (!shipping.name || !shipping.phone || !shipping.address) {
      msg.textContent = "⚠️ Fill all required fields.";
      msg.style.color = "red";
      return;
    }
    if (!/^\d{10}$/.test(shipping.phone)) {
      msg.textContent = "⚠️ Enter a valid 10-digit phone number.";
      msg.style.color = "red";
      return;
    }
    if (!/^\d{6}$/.test(shipping.pincode)) {
      msg.textContent = "⚠️ Enter a valid 6-digit pincode.";
      msg.style.color = "red";
      return;
    }

    // ===== SAVE SHIPPING INFO AND ORDER ID =====
    sessionStorage.setItem('shippingInfo', JSON.stringify(shipping));
    if (!sessionStorage.getItem('orderId')) {
      sessionStorage.setItem('orderId', 'ORD-' + Date.now());
    }

    // ===== REDIRECT TO PAYMENT PAGE =====
    window.location.href = 'payment.html';
  });
});
</script>


</body>
</html>
